<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Exact DOWN? attitude: -9deg rotation, 1.38 horizontal stretch, heavy black 3D extrusion -->
  <g transform="translate(29, 45) rotate(-9) scale(1.38, 1)">
    <!-- 3D Extrusion Shadow Layers (Solid Black Stack) -->
    <text x="5" y="5" text-anchor="middle" font-family="'Impact', 'Arial Black', 'Archivo Black', sans-serif" font-weight="900" font-size="46" fill="#000000" stroke="#000000" stroke-width="5.5" stroke-linejoin="miter" style="paint-order: stroke fill">?</text>
    <text x="4" y="4" text-anchor="middle" font-family="'Impact', 'Arial Black', 'Archivo Black', sans-serif" font-weight="900" font-size="46" fill="#000000" stroke="#000000" stroke-width="5.5" stroke-linejoin="miter" style="paint-order: stroke fill">?</text>
    <text x="3" y="3" text-anchor="middle" font-family="'Impact', 'Arial Black', 'Archivo Black', sans-serif" font-weight="900" font-size="46" fill="#000000" stroke="#000000" stroke-width="5.5" stroke-linejoin="miter" style="paint-order: stroke fill">?</text>
    <text x="2" y="2" text-anchor="middle" font-family="'Impact', 'Arial Black', 'Archivo Black', sans-serif" font-weight="900" font-size="46" fill="#000000" stroke="#000000" stroke-width="5.5" stroke-linejoin="miter" style="paint-order: stroke fill">?</text>
    <text x="1" y="1" text-anchor="middle" font-family="'Impact', 'Arial Black', 'Archivo Black', sans-serif" font-weight="900" font-size="46" fill="#000000" stroke="#000000" stroke-width="5.5" stroke-linejoin="miter" style="paint-order: stroke fill">?</text>
    
    <!-- Top Face: Punchy Hazard Crimson (#FF1E44) with Heavy Black Outline -->
    <text x="0" y="0" text-anchor="middle" font-family="'Impact', 'Arial Black', 'Archivo Black', sans-serif" font-weight="900" font-size="46" fill="#FF1E44" stroke="#000000" stroke-width="5.5" stroke-linejoin="miter" style="paint-order: stroke fill">?</text>
  </g>
</svg>
